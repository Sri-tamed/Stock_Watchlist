<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Watchlist</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 2rem auto; padding: 0 1rem; background: #f9f9f9; }
    h1 { text-align: center; color: #1a1a1a; }
    form { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    input[type='text'] { flex-grow: 1; padding: 0.75rem; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; }
    button { padding: 0.75rem 1.5rem; border: none; background-color: #007bff; color: white; border-radius: 6px; font-size: 1rem; cursor: pointer; transition: background-color 0.2s; }
    button:hover { background-color: #0056b3; }
    button:disabled { background-color: #a0a0a0; }
    #watchlist { list-style: none; padding: 0; }
    #watchlist li { background: white; border: 1px solid #ddd; padding: 1rem; margin-bottom: 0.5rem; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    .message { padding: 1rem; margin-bottom: 1rem; border-radius: 6px; text-align: center; }
    .message.success { background-color: #d4edda; color: #155724; }
    .message.error { background-color: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

  <h1>My Stock Watchlist</h1>

  <form id="stockForm">
    <input type="text" id="tickerInput" placeholder="Enter stock ticker (e.g., AAPL)" required>
    <button type="submit">Add Stock</button>
  </form>

  <div id="messageArea"></div>

  <ul id="watchlist"></ul>

  <script>
    const form = document.getElementById('stockForm');
    const input = document.getElementById('tickerInput');
    const addButton = form.querySelector('button');
    const watchlist = document.getElementById('watchlist');
    const messageArea = document.getElementById('messageArea');

    const tickerRegex = /^[A-Z]{1,5}$/;

    // --- Functions ---

    const showMessage = (type, text) => {
      messageArea.innerHTML = `<div class="message ${type}">${text}</div>`;
      setTimeout(() => messageArea.innerHTML = '', 4000);
    };

    const fetchWatchlist = async () => {
      try {
        const res = await fetch('/api/watchlist');
        const result = await res.json();

        if (!result.success) {
          throw new Error(result.error || 'Could not fetch watchlist.');
        }

        watchlist.innerHTML = ''; // Clear current list
        result.data.forEach(stock => {
          const li = document.createElement('li');
          li.textContent = stock.name;
          watchlist.appendChild(li);
        });
      } catch (err) {
        showMessage('error', err.message);
      }
    };

    const addStock = async (ticker) => {
      try {
        const res = await fetch('/api/add', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ name: ticker }),
        });

        const result = await res.json();

        if (!result.success) {
          throw new Error(result.error || 'An unknown error occurred.');
        }

        showMessage('success', `Successfully added ${result.data.name} to the watchlist.`);
        input.value = ''; // Clear input
        fetchWatchlist(); // Refresh list
      } catch (err) {
        showMessage('error', err.message);
      }
    };

    // --- Event Listeners ---

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const ticker = input.value.trim().toUpperCase();

      if (!ticker) {
        showMessage('error', 'Ticker symbol cannot be empty.');
        return;
      }

      if (!tickerRegex.test(ticker)) {
        showMessage('error', 'Invalid ticker format. Must be 1-5 uppercase letters.');
        return;
      }

      addStock(ticker);
    });
    
    input.addEventListener('input', () => {
        const ticker = input.value.trim().toUpperCase();
        addButton.disabled = !tickerRegex.test(ticker);
    });

    // Initial load
    document.addEventListener('DOMContentLoaded', () => {
        fetchWatchlist();
        addButton.disabled = true; // Disable button initially
    });

  </script>
</body>
</html>
